# FreeITSM - nginx server block
#
# ─────────────────────────────────────────────────────────────────────────────
#  WHY THIS FILE EXISTS
#
#  nginx does not read .htaccess. It has no equivalent and never consults one.
#  FreeITSM ships twelve .htaccess files, and nine of them are SECURITY controls,
#  not conveniences: they are what stop a ticket attachment being downloaded by
#  URL without signing in, and what stop an uploaded file being executed as PHP.
#
#  On Apache those controls apply automatically. On nginx they do not exist until
#  the rules below are in place. This is not optional hardening - without the
#  "Attachments and uploads" section, every attachment on every ticket is
#  publicly downloadable to anyone who can guess or is given the URL.
#
#  See: https://github.com/edmozley/freeitsm/wiki/Running-on-nginx
#       https://github.com/edmozley/freeitsm/issues/68
# ─────────────────────────────────────────────────────────────────────────────
#
#  USAGE
#    1. Copy to /etc/nginx/sites-available/freeitsm.conf
#    2. Set `server_name` and `root` below.
#    3. Set `fastcgi_pass` to your PHP-FPM socket or address.
#    4. nginx -t && systemctl reload nginx
#
#  Serve over HTTPS in production. A plain :80 block is shown so the file works
#  as-is for a first run; put certbot or your own certificates in front of it.

server {
    listen 80;
    server_name  itsm.example.com;          # <-- CHANGE ME
    root         /var/www/freeitsm;         # <-- CHANGE ME (the folder holding index.php)

    index index.php;

    # Uploads: attachments are capped at 20 MB by the application, so allow a
    # little headroom. nginx's default of 1 MB silently 413s a normal document.
    client_max_body_size 25m;

    # -- Options -Indexes -----------------------------------------------------
    # No directory listings anywhere. nginx's default is already off; stated
    # explicitly so a later `autoindex on` for debugging is an obvious change.
    autoindex off;

    # =========================================================================
    #  SECURITY - the .htaccess equivalents. Do not remove any of these.
    # =========================================================================

    # -- Attachments and uploads: NEVER served directly -----------------------
    # Apache: `Require all denied` in each of these folders. Every one of these
    # files is reached through a PHP endpoint that checks permissions first; the
    # file itself must never be fetchable by URL. Returning 404 rather than 403
    # also avoids confirming that a given attachment id exists.
    location ^~ /tickets/attachments/            { return 404; }
    location ^~ /change-management/attachments/  { return 404; }
    location ^~ /war-room/attachments/           { return 404; }
    location ^~ /contracts/rfp-builder/uploads/  { return 404; }
    location ^~ /recordings/                     { return 404; }
    # Documents attached to records. These are reached through
    # api/documents/download.php, which checks that you can see something the
    # document is attached to. The stored name is random, but a random name is
    # not a permission — without this line every attached contract, invoice and
    # warranty on the system is fetchable by anyone who learns the URL.
    location ^~ /uploads/                        { return 404; }

    # -- The developer test suite: never reachable over HTTP ------------------
    # Apache: tests/.htaccess. These scripts are a development tool that ships
    # in the repository because the wiki's developer guides refer to them, and
    # because a contributor needs them. They are not part of the application and
    # nobody running FreeITSM has any use for them.
    #
    # They write to the REAL tables - creating forms, assets, documents and
    # working analyst accounts with passwords published in a public repository -
    # and each one only tidies up after itself if it runs to the end. Served by
    # a web server that makes them unauthenticated write endpoints which can be
    # cut off half way, leaving what they created behind. Their failure messages
    # also print real records back to whoever asked.
    #
    # Every .php file in there refuses to run unless PHP_SAPI is 'cli', so this
    # is the second defence rather than the only one - but that guard cannot
    # cover the .html and .sh files beside them, and this line can.
    location ^~ /tests/                          { return 404; }

    # -- Command-line tools: never run over HTTP -----------------------------
    # Apache: scripts/.htaccess. These ship in production (the Intune workers,
    # directory sync, cron tokens) but are run with `php scripts/<name>.php`,
    # never from a browser, and several write. Every .php in there refuses to
    # run unless PHP_SAPI is 'cli' (tests/web-exposure-guard.php checks it);
    # this is the second layer. The inventory agent (.ps1) stays downloadable.
    location ~* ^/scripts/.+\.(php|phtml|sh|md|config)$ { return 404; }

    # -- Upload folders that ARE served, but must never execute ---------------
    # Apache: `php_flag engine off` + RemoveHandler. These hold files a user
    # supplied (course content, a branding logo), so a .php among them must be
    # returned as text, never run. The application also allow-lists extensions
    # and renames on upload - this is the third defence, not the only one.
    location ^~ /lms/content/ {
        location ~ \.(php[0-9]?|phtml|phar|cgi|pl|py|asp|aspx|jsp|sh)$ { return 404; }
        default_type text/plain;
    }
    location ^~ /system/uploads/branding/ {
        location ~ \.(php[0-9]?|phtml|phar|cgi|pl|py|asp|aspx|jsp|sh)$ { return 404; }
    }

    # -- Nothing anywhere may execute a second-guess PHP extension ------------
    # Belt and braces: only real .php files run, and only outside upload folders.
    location ~* \.(phtml|phar|php[0-9]|phps|cgi|pl|py|sh|inc)$ { return 404; }

    # -- Dotfiles, VCS metadata and stray editor files ------------------------
    # /.git/config served over HTTP leaks your entire history and often your
    # remote credentials. Apache does not block this either - see the wiki.
    location ~ /\.(?!well-known) { return 404; access_log off; }
    location ~* \.(sql|bak|orig|swp|dist|sample|log|ini)$ { return 404; }

    # -- The CSAT survey is reached only through its pretty URL ----------------
    # Apache: tickets/csat/.htaccess 404s a direct hit on survey.php.
    location = /tickets/csat/survey.php { return 404; }

    # =========================================================================
    #  PRETTY URLs - the mod_rewrite equivalents
    # =========================================================================
    #
    # NOTE: as of issue #68 the application no longer DEPENDS on any of these.
    # Every internal redirect points at a real file path (auth/login.php), so
    # FreeITSM works with this whole section deleted. These exist so the tidy
    # public URLs and existing bookmarks keep working.

    location = /login           { rewrite ^ /auth/login.php last; }
    location = /logout          { rewrite ^ /auth/analyst_logout.php last; }
    location = /forgot-password { rewrite ^ /auth/forgot-password.php last; }
    location = /reset-password  { rewrite ^ /auth/reset-password.php last; }
    location = /csat            { rewrite ^ /tickets/csat/survey.php last; }

    # Asset QR labels: /a/<token>
    location ~ ^/a/([A-Za-z0-9]+)$ { rewrite ^ /asset-management/scan.php?token=$1 last; }

    # Legacy .php URLs -> 301 to the pretty form, for bookmarks and old emails.
    location = /login.php           { return 301 /login$is_args$args; }
    location = /forgot-password.php { return 301 /forgot-password$is_args$args; }
    location = /reset-password.php  { return 301 /reset-password$is_args$args; }
    location = /csat.php            { return 301 /csat$is_args$args; }

    # Root-level shims kept at their own URL (registered callbacks, POST targets).
    location = /analyst_logout.php        { rewrite ^ /auth/analyst_logout.php last; }
    location = /force_password_change.php { rewrite ^ /auth/force_password_change.php last; }
    location = /logout.php                { rewrite ^ /auth/logout.php last; }
    location = /oauth_callback.php        { rewrite ^ /auth/oauth_callback.php last; }
    location = /google_oauth_callback.php { rewrite ^ /auth/google_oauth_callback.php last; }

    # -- REST API v1: everything not a real file goes to the front controller --
    location /api/v1/ {
        rewrite ^/api/v1/openapi\.json$  /api/v1/openapi.php?format=json last;
        rewrite ^/api/v1/openapi\.ya?ml$ /api/v1/openapi.php?format=yaml last;
        try_files $uri $uri/ /api/v1/index.php$is_args$args;
    }

    # -- System integrations pretty URLs --------------------------------------
    location /system/integrations/ {
        try_files $uri $uri/ @integrations;
    }
    location @integrations {
        rewrite ^/system/integrations/([a-z0-9-]+)/help/?$ /system/integrations/help.php?provider=$1 last;
        rewrite ^/system/integrations/([a-z0-9-]+)/?$       /system/integrations/provider.php?provider=$1 last;
        return 404;
    }

    # =========================================================================
    #  PHP
    # =========================================================================
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        # NB: no `try_files` here. Debian's snippets/fastcgi-php.conf already
        # contains `try_files $fastcgi_script_name =404;`, and a second one in
        # this block is a duplicate-directive error that stops nginx starting.
        include snippets/fastcgi-php.conf;

        # <-- CHANGE ME to match your PHP-FPM: a socket, or 127.0.0.1:9000
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        # NOTE: session hardening is NOT set here, on purpose.
        #
        # The root .htaccess sets it with php_value, which only mod_php reads.
        # FreeITSM therefore also ships a `.user.ini` in the application root,
        # and THAT is what PHP-FPM reads - so nginx installs already get
        # session.cookie_httponly, samesite, use_strict_mode and use_only_cookies
        # without anything being repeated here.
        #
        # Duplicating them into fastcgi_param PHP_VALUE would work, but it would
        # be a fourth copy of the same four settings to keep in step. If you are
        # hardening further, edit .user.ini rather than adding it here.
        #
        # Requires PHP's user_ini.filename to be at its default (.user.ini). If
        # your build disables it, set the values here instead.
    }
}
